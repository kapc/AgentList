<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — AgentList</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="auth-page">
  <nav class="topnav">
    <a class="brand" href="/">AgentList</a>
    <div class="nav-links"><a href="/signup">Sign up</a></div>
  </nav>

  <main class="auth-center">
    <section class="auth-card">
      <div class="auth-card-header">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to your applicant agent</p>
      </div>
      <div class="auth-card-body">
        <button type="button" id="google-btn" class="btn-google full" hidden>Continue with Google</button>
        <p id="google-hint" class="muted small" hidden></p>
        <div id="google-divider" class="divider" hidden>or</div>

        <form id="login-form" class="grid">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com" />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password" />
          </div>
          <button type="submit" class="full">Log in</button>
        </form>

        <p class="auth-footer">No account? <a href="/signup">Create one free</a></p>
        <div id="msg" class="msg" hidden></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
  <script>
    showQueryError('msg');
    setupGoogleAuth('google-btn', 'Log in with Google').then(() => {
      const btn = document.getElementById('google-btn');
      const divider = document.getElementById('google-divider');
      if (btn && !btn.hidden && divider) divider.hidden = false;
    });
    bindForm('login-form', async (data) => {
      const res = await api('/api/v1/auth/login', { method: 'POST', body: JSON.stringify(data) });
      if (res.ok) { window.location.href = '/dashboard'; return; }
      showMsg('msg', 'error', res.body.error || 'Login failed');
    });
  </script>
</body>
</html>
